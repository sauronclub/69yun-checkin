name: 69yun Daily Checkin

on:
  schedule:
    # 每天北京时间 09:00 运行（UTC 01:00）
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YUN_EMAIL: ${{ secrets.YUN_EMAIL }}
      YUN_PASSWORD: ${{ secrets.YUN_PASSWORD }}
      BASE_URL: ${{ vars.BASE_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 纯 HTTP 实现，只需 requests，不再安装 Playwright 和 Chromium
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin
        run: python main.py
