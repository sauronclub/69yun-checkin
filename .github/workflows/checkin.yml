name: 69yun Daily Checkin

on:
  schedule:
    # 每天北京时间 09:00 运行（UTC 01:00）
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 最小权限：只读仓库内容，不需要写任何东西
    permissions:
      contents: read
    # 手动触发与定时任务撞车时，让后到的等待而不是并发签到
    concurrency:
      group: 69yun-checkin
      cancel-in-progress: false
    env:
      YUN_EMAIL: ${{ secrets.YUN_EMAIL }}
      YUN_PASSWORD: ${{ secrets.YUN_PASSWORD }}
      # 不在这里设 BASE_URL：vars.BASE_URL 未配置时会展开成空字符串。
      # 留空则由 config.py 使用内置默认值，避免拼出非法 URL。
      # 若要换站点，请在本仓库 Settings → Variables 新增 BASE_URL。
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 纯 HTTP 实现，只需 requests，不再安装 Playwright 和 Chromium
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin
        run: python main.py
